# Pre-commit hooks for polyglot-code-guard
#
# Install once after cloning:
#   python -m pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# These hooks are local-only: CI runs pytest with the 100% coverage gate, builds the
# distributions, and validates them with twine, but does not run these hooks.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 3b3f7c3f57fe9925356faf5fe6230835138be230 # v0.15.17
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
